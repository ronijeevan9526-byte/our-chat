
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Space</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101116;
  color: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.chat {
  width: 100%;
  max-width: 480px;
  height: 90vh;
  background: #191a22;
  border: 1px solid #33343d;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  padding: 20px;
  background: #22232d;
  border-bottom: 1px solid #34343c;
}
header h2 { margin: 0; font-size: 20px; }
header p { color: #aaa; font-size: 12px; margin: 8px 0 0; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  padding: 12px 15px;
  border-radius: 16px;
  max-width: 80%;
  word-wrap: break-word;
  background: #30313c;
  align-self: flex-start;
}
.msg.mine {
  background: #6755c9;
  align-self: flex-end;
}
form {
  display: flex;
  gap: 10px;
  padding: 14px;
  background: #22232d;
}
input {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #14151b;
  color: white;
  outline: none;
}
button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  background: #7665df;
  color: white;
  cursor: pointer;
}
.notice {
  padding: 8px 14px;
  font-size: 11px;
  color: #aaa;
  text-align: center;
}
</style>
</head>
<body>
<div class="chat">
  <header>
    <h2>Our Space ✨</h2>
    <p>A little place to talk</p>
  </header>
  <div id="messages"></div>
  <div class="notice">Demo interface — messages are not connected yet.</div>
  <form id="form">
    <input id="input" placeholder="Write a message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>
<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const messages = document.getElementById("messages");

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  const bubble = document.createElement("div");
  bubble.className = "msg mine";
  bubble.textContent = text;
  messages.appendChild(bubble);
  input.value = "";
  messages.scrollTop = messages.scrollHeight;
});
</script>
</body>
</html>
